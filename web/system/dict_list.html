<? define "sysdict/list.htm" ?>
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title></title>
  <meta name="renderer" content="webkit">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <link rel="stylesheet" href="/static/layui/css/layui.css" media="all">
	<!--[if lt IE 9]>
	<script src="https://oss.maxcdn.com/html5shiv/3.7.3/html5shiv.min.js"></script>
	<script src="https://oss.maxcdn.com/respond/1.4.2/respond.min.js"></script>
    <![endif]-->
</head>
<body>
<!-- 正文开始 -->
<div class="layui-fluid" style="padding: 20px 15px 15px 15px;">
    <div class="layui-card">
        <div class="layui-card-body">
            <!-- 表格工具栏 -->
            <form class="layui-form toolbar table-tool-mini">
                <div class="layui-form-item">
				  <div class="layui-inline">
                        <label class="layui-form-label w-auto">名称:</label>
                        <div class="layui-input-inline">
                            <input name="pname" autocomplete="off" class="layui-input" type="text" placeholder=""/>
                        </div>
                    </div>
					<div class="layui-inline">
                        <label class="layui-form-label w-auto">类型:</label>
                        <div class="layui-input-inline">
                            <select lay-search name="ptype" lay-filter="ptype"  >
							  <option value="">请选择</option>
							  <? range $k, $v  := .ptype ?>
								<option value="<? $k ?>" ><? $v ?></option>
							  <? end ?>
							  </select>
                        </div>
                    </div>

					<div class="layui-inline" >
					    <button class="layui-btn icon-btn layui-btn-radius layui-btn-sm" lay-filter="LAY-app-search" lay-submit>
					        <i class="layui-icon">&#xe615;</i>查询
					    </button>

						<button class="layui-btn icon-btn layui-btn-radius layui-btn-sm" id="inputBtnAdd"  type="button">
						  <i class="layui-icon layui-icon-addition layuiadmin-button-btn"></i>新增
						</button>
					</div>
                </div>
            </form>
            <!-- 数据表格 -->
            <table id="LAY-app-goods-apply-list" lay-filter="LAY-app-goods-apply-list"></table>
			<script type="text/html" id="table-forum-replys">
			    <a class="layui-btn layui-btn-normal layui-btn-xs" lay-event="set"><i class="layui-icon layui-icon-set"></i>设置</a>
				<a class="layui-btn layui-btn-normal layui-btn-xs" lay-event="edit"><i class="layui-icon layui-icon-edit"></i>编辑</a>
				<a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del"><i class="layui-icon layui-icon-delete"></i>删除</a>
			</script>
        </div>
    </div>
</div>

<script type="text/javascript" src="/static/layui/layui.js"></script>
<script>
    layui.use(function () {
        var $ = layui.$
            ,form = layui.form
            ,table = layui.table;

    //监听搜索
    form.on('submit(LAY-app-search)', function(data){
      var field = data.field;
      
      //执行重载
      table.reload('LAY-app-goods-apply-list', {
        where: field
      });
	  return false;
    });


    table.render({
  	elem: '#LAY-app-goods-apply-list'
	,height: 'full-98'
  	,url:  '?module=sysdict&act=main&do=getdata'
	,cellMinWidth: 100
  	,cols: [[
	   {type: 'numbers'}
	  ,{field: 'pname', title: '名称',sort:true}
	  ,{field: 'ptypename', title: '系统组',sort:true}
	  ,{field: 'remarks', title:'备注',sort:true}
	  ,{field: 'result', title: '数据统计'}
	  ,{field: 'tabnum', title: '关联字段',event: 'viewlink', style:'cursor: pointer;',}
	   ,{title: '操作', width:530,fixed: 'right', toolbar: '#table-forum-replys'}
  	]]
  	,page: true
  	,limit:	30
  	,limits: [30,10,100]
  	,text: {
		none:'暂无数据'
		}
    });

	 /* 表格工具条点击事件 */
	table.on('tool(LAY-app-goods-apply-list)', function (obj) {
		var data = obj.data; // 获得当前行数据
		var id = data.id;

		if (obj.event == 'viewlink'){
			var str = '<div style="background-color: #FFF; overflow:auto; max-height:350px;"><table class="layui-table" style="color:#78BA32;" lay-size="sm"><tr><td align="center" width="120px;">数据表</td><td align="center" width="120px;">字段</td></tr>';
                for (var i = 0; i < data.list.length; i++) {
                    str += '<tr>';
                    str += '<td align="center">'+data['list'][i]['tabname']+'</td>';
                    str += '<td align="center">'+data['list'][i]['cname']+'</td>';
                    str += '</tr>';
                };
                str += '</table></div>'
                layer.tips(str,$(this),{tips: [3,'#78BA32'],area: ['600px', 'auto'],time: false,shadeClose:true,shade:"0.3"});
		} else
		if(obj.event === 'del'){
        layer.confirm('确定删除？', function(index){
          
          $.ajax({
                url: '?module=sysdict&act=main&do=del&id='+id,
                type: 'get',
                dataType: 'json',
                success: function (res) {
                    if (res.code === 0) {
						table.reload("LAY-app-goods-apply-list");
						layer.msg('完成',{icon:1});
                    }else {
						if (res.msg) {
							layer.msg(res.msg, {icon: 5});
						} else layer.msg('失败', {icon: 5});
                    }
                }
            });
        });
      }else
		if (obj.event === 'edit') { // 修改
			layer.open({
			  type: 2
			  ,title: '编辑'
			  ,content: '?module=sysdict&act=main&do=add&id='+id
			  ,area: ['100%', '100%']
			  ,btn: ['确定', '取消']
			  ,resize: false
			  ,yes: function(index, layero){
				var submit = layero.find('iframe').contents().find("#layuiadmin-app-form-submit");
				submit.click();
			  }
			});
		}
		else if(obj.event === 'set'){
			var tr = $(obj.tr);
	  
			layer.open({
			  type: 2
			  ,title: '设置字典'
			  ,content: '?module=sysdict&act=main&do=set&id='+id
			  ,area: ['100%', '100%']
			  ,btn: ['确定', '取消']
			  ,resize: false
			  ,yes: function(index, layero){
				var submit = layero.find('iframe').contents().find("#layuiadmin-app-form-submit");
				submit.click();
			  }

			});
		}
	 });

	//新增
	$('#inputBtnAdd').click(function(){
		layer.open({
		  type: 2
		  ,title: '添加'
		  ,content: '?module=sysdict&act=main&do=add'
		  ,maxmin: true
		  ,area: ['100%', '100%']
		  ,btn: ['确定', '取消']
		  ,yes: function(index, layero){
			//点击确认触发 iframe 内容中的按钮提交
			var submit = layero.find('iframe').contents().find("#layuiadmin-app-form-submit");
			submit.click();
		  }
		});
	});

  });
  </script>
</body>
</html>
<? end ?>

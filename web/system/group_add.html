<? define "sysgroup/sysgroupAdd.htm" ?>
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title></title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <link rel="stylesheet" href="/static/layui/css/layui.css" media="all">
</head>
<body>

<div class="layui-form layui-form-pane" lay-filter="layuiadmin-app-form-list" id="layuiadmin-app-form-list" style="padding: 20px 30px 10px 20px;">
    <input name="id" type="hidden" value="<?.info.ID?>"/>

    <div class="layui-form-item">
        <label class="layui-form-label">名称</label>
        <div class="layui-input-block">
            <input type="text" name="gname" value="<?.info.Gname?>" lay-verify="required" placeholder="请输入名称" autocomplete="off" class="layui-input">
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">图标</label>
        <div class="layui-input-block">
            <input type="text" name="icon" value="<?.info.Icon?>" lay-verify="required" placeholder="请输入" autocomplete="off" class="layui-input">
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">首页模板</label>
        <div class="layui-input-block">
            <input type="text" name="indextpl" value="<?.info.Indextpl?>" lay-verify="required" placeholder="请输入" autocomplete="off" class="layui-input">
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">状态</label>
        <div class="layui-input-block">
            <input type="number" name="state" value="<?.info.State?>" lay-verify="required" placeholder="请输入" autocomplete="off" class="layui-input">
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">排序</label>
        <div class="layui-input-block">
            <input type="number" name="ordnum" value="<?.info.Ordnum?>" autocomplete="off" class="layui-input">
        </div>
    </div>

    <div class="layui-form-item layui-hide">
        <input type="button" lay-submit lay-filter="layuiadmin-app-form-submit" id="layuiadmin-app-form-submit" value="确认添加">
        <input type="button" lay-submit lay-filter="layuiadmin-app-form-edit" id="layuiadmin-app-form-edit" value="确认编辑">
    </div>
</div>

<script src="/static/layui/layui.js"></script>

<script>
    layui.use(function () {
        var $ = layui.$;
        var layer = layui.layer;
        var form = layui.form;

        form.on("submit(layuiadmin-app-form-submit)", function(data){
            var field = data.field;
            var index = parent.layer.getFrameIndex(window.name);

            var t = layer.load(1);

            field.id = Number(field.id) || 0;
            var apiUrl = '?module=sysgroup&act=main&do=create'; // 默认是新增
            if (field.id > 0) {
                apiUrl = '?module=sysgroup&act=main&do=update';
            }

            $.ajax({
                url: apiUrl,
                type: "post",
                dataType: "json",
                contentType: "application/json; charset=utf-8",
                data: JSON.stringify(field),
                success: function (res) {
                    if (res.code === 0) {
                        parent.layui.table.reload("LAY-table-list");
                        parent.layer.close(index);
                    } else {
                        if (res.msg) {
                            layer.msg(res.msg, {icon: 5});
                        } else layer.msg("操作失败", {icon: 5});
                    }
                    layer.close(t);
                },
                error: function (xhr) {
                    layer.close(t);
                    layer.msg("网络异常", {icon: 5});
                }
            });
        });
    });
</script>
</body>
</html>
<? end ?>

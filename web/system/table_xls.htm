<? define "systable/xls.htm" ?>
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title></title>
  <meta name="renderer" content="webkit">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <link rel="stylesheet" href="/static/layui/css/layui.css" media="all">
</head>
<body>

	<div>

	<div class="layui-card-body">
        <table id="LAY-table-list" lay-filter="LAY-table-list"></table>

	<script  id="userTbState">
	<input type="checkbox" lay-filter="taskStateCk" value="{{d.id}}" lay-skin="switch" lay-text="打开|关闭" {{d.xls==1?'checked':''}} style="display: none;" >
	</script>
	
      </div>
	
	<div class="layui-form-item layui-hide">
      <input type="button" lay-submit lay-filter="layuiadmin-app-form-submit" id="layuiadmin-app-form-submit" value="确认添加">
      <input type="button" lay-submit lay-filter="layuiadmin-app-form-edit" id="layuiadmin-app-form-edit" value="确认编辑">
    </div>

  </div>

  <script type="text/html" id="tbBasicTbBar">
  <a class="layui-btn  layui-btn-xs" lay-event="edit"><i class="layui-icon layui-icon-transfer"></i>编辑</a>
  </script>

    <script src="/static/layui/layui.js"></script>
<script>
layui.use(['layer', 'form', 'table'], function () {
    var $ = layui.$
    ,form = layui.form
    ,table = layui.table;
	
	var tableIns = table.render({
		elem: '#LAY-table-list'
		,height:535
		,url:  '?module=systable&act=tab&do=xlsgetdata&id=<?.id?>' 
		,cols: [[
		  {field: 'state', title: '开启', templet: '#userTbState', sort: true, width: 100}
		  ,{field: 'fname', title: 'name', width: 100}
		  ,{field: 'cname', title:	'中文', width: 150}
		  ,{field: 'xlsc', title:	'绑定列', }
		  ,{field: 'tabname', title:	'关联表', }
		  ,{field: 'ckfname', title:	'判断字段', }
		  ,{title: '操作',   toolbar: '#tbBasicTbBar', width: 220}
		  
		]]
		,page: false
		,limit:	20
		,limits: [10, 15, 20, 25, 30]
		,text: {none: '暂无相关数据！'}
    });
	
	form.on('switch(taskStateCk)', function (obj) {
		$.get('?module=systable&act=field&do=setxls', {
			fieldID: obj.elem.value,
			state: obj.elem.checked ? 1 : 0
		}, function (res) {
			if (res.code === 0) {
				tableIns.reload();
				layer.msg('完成', {icon: 1});
			} else {
				layer.msg('失败', {icon: 2});
				$(obj.elem).prop('checked', !obj.elem.checked);
				form.render('checkbox');
			}
		}, 'json');
	});

	table.on('tool(LAY-table-list)',function(obj){
		var data = obj.data;
		
	  if(obj.event === 'edit'){
		  if (data.xid < 1) {
			layer.msg('请先开启xls字段', {icon: 5});
			return;
		  }
		layer.open({
		  type: 2
		  ,title: 'XLS'
		  ,content: '?module=systable&act=tab&do=xlsedit&id='+data.xid
		  ,area: ['100%', '100%']
		  ,btn: ['保存', '取消']
		  ,resize: false
		  ,yes: function(index, layero){
			var submit = layero.find('iframe').contents().find("#layuiadmin-app-form-submit");
			submit.click();
		  }
		});
      }

	});


  });

  </script>
</body>
</html>
<? end ?>

<? define "systable/fieldset.htm" ?>
<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title></title>
	<meta name="renderer" content="webkit">
	<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=0">
	<link rel="stylesheet" href="/static/layui/css/layui.css" media="all">
</head>
<body>

<div class="layui-form model-form" lay-filter="layuiadmin-app-form-list" id="layuiadmin-app-form-list" style="padding: 20px 30px 0 0;">
	<input name="id" type="hidden" value="<?.id?>"/>
	<div class="layui-form-item">
		<label class="layui-form-label">字段名</label>
		<div class="layui-input-inline">
			<input type="text" name="fname"  value="<?.one.fname?>" lay-verify="required" placeholder="请输入" autocomplete="off" class="layui-input">
		</div>
		<label class="layui-form-label">中文名</label>
		<div class="layui-input-inline">
			<input type="text" name="cname" value="<?.one.cname?>" lay-verify="required" placeholder="请输入" autocomplete="off" class="layui-input">
		</div>

		<label class="layui-form-label">必填</label>
		<div class="layui-input-inline">
			<select name="required" lay-verify="required" >
				<option value="">请选择</option>
				<? range $i,$v := .yesNo ?>
				<option value="<? $i ?>" <?if eq $i $.one.required?> selected  <? end ?> ><? $v ?></option>
				<?end?>
			</select>
		</div>

		<label class="layui-form-label">字段默认值</label>
		<div class="layui-input-inline">
			<input type="text" name="sqldefault" value="<?.one.sqldefault?>" autocomplete="off" class="layui-input">
		</div>

	</div>

	<div class="layui-form-item">
		<label class="layui-form-label">类型</label>
		<div class="layui-input-inline">
			<select name="ftype" lay-verify="required" >
				<option value="">请选择</option>
				<? range $i,$v := .ftype ?>
				<option value="<? $i ?>" <?if eq $i $.one.ftype?> selected  <? end ?> ><? $v ?></option>
				<?end?>
			</select>
		</div>
		<label class="layui-form-label">长度</label>
		<div class="layui-input-inline">
			<input type="number" name="flen" value="<?.one.flen?>" autocomplete="off" class="layui-input">
		</div>


		<label class="layui-form-label">输入框类型</label>
		<div class="layui-input-inline">
			<select name="input" lay-verify="required" >
				<option value="">请选择</option>
				<option value="text" <?if eq .one.input "text" ?> selected  <? end ?>>文本</option>
				<option value="number" <?if eq .one.input "number" ?> selected  <? end ?>>数字</option>
				<option value="select" <?if eq .one.input "select" ?> selected  <? end ?>>下拉框</option>
				<option value="radio" <?if eq .one.input "radio" ?> selected  <? end ?>>选择框</option>
				<option value="checkbox" <?if eq .one.input "checkbox" ?> selected  <? end ?>>多选框</option>
				<option value="xmselect" <?if eq .one.input "xmselect" ?> selected  <? end ?>>XM多选</option>
				<option value="hidden" <?if eq .one.input "hidden" ?> selected  <? end ?>>隐藏</option>
				<option value="date" <?if eq .one.input "date" ?> selected  <? end ?>>日期</option>
				<option value="textarea" <?if eq .one.input "textarea" ?> selected  <? end ?>>长文本</option>
				<option value="phone" <?if eq .one.input "phone" ?> selected  <? end ?>>手机</option>
				<option value="mail" <?if eq .one.input "mail" ?> selected  <? end ?>>邮箱</option>
				<option value="file" <?if eq .one.input "file" ?> selected  <? end ?>>文件</option>
				<option value="pic" <?if eq .one.input "pic" ?> selected  <? end ?>>图片</option>
				<option value="bool" <?if eq .one.input "bool" ?> selected  <? end ?>>选中框</option>

			</select>
		</div>

		<label class="layui-form-label">索引</label>
		<div class="layui-input-inline">
			<select name="is_index" lay-verify="required">
				<option value="">请选择</option>
				<? range $i,$v := .yesNo ?>
				<option value="<? $i ?>" <?if eq $i $.one.is_index?> selected  <? end ?> ><? $v ?></option>
				<?end?>
			</select>
		</div>
	</div>


	<div class="layui-form-item">

		<label class="layui-form-label">列表显示</label>
		<div class="layui-input-inline">
			<select name="islist" lay-verify="required">
				<option value="">请选择</option>
				<? range $i,$v := .yesNo ?>
				<option value="<? $i ?>" <?if eq $i $.one.islist ?> selected  <? end ?> ><? $v ?></option>
				<?end?>
			</select>
		</div>

		<label class="layui-form-label">查询方式</label>
		<div class="layui-input-inline">
			<select name="fsearchway" lay-verify="required" >
				<option value="=" <?if eq .one.fsearchway "=" ?> selected  <? end ?>>=</option>
				<option value=">" <?if eq .one.fsearchway ">" ?> selected  <? end ?>>></option>
				<option value="<" <?if eq .one.fsearchway "<" ?> selected  <? end ?>><</option>
				<option value="%" <?if eq .one.fsearchway "%" ?> selected  <? end ?>>%</option>
				<option value="IN" <?if eq .one.fsearchway "IN" ?> selected  <? end ?>>IN</option>

			</select>
		</div>

		<label class="layui-form-label">排序</label>
		<div class="layui-input-inline">
			<input type="number" name="ordnum" value="<?.one.ordnum?>" autocomplete="off" class="layui-input">
		</div>

		<label class="layui-form-label">搜索</label>
		<div class="layui-input-inline">
			<select name="fsearch" lay-verify="required">
				<option value="">请选择</option>
				<? range $i,$v := .yesNo ?>
				<option value="<? $i ?>" <?if eq $i $.one.fsearch ?> selected  <? end ?> ><? $v ?></option>
				<?end?>
			</select>
		</div>


	</div>

	<div class="layui-form-item">

		<label class="layui-form-label">关联字典</label>
		<div class="layui-input-inline">
			<select name="fvarname" id="fvarname" lay-filter="fvarname" >
				<option value="">可选</option>
				<? range  .parlist ?>
				<option value="<?.Pname?>" <?if eq $.one.fvarname .Pname ?> selected  <? end ?>><?.Remarks?>[<?.Pname?>]</option>
				<? end ?>
			</select>
		</div>

		<div id="fvarkey-group" style="display: none;">
			<label class="layui-form-label">关联类型</label>
			<div class="layui-input-inline">
				<select name="fvarkey" id="fvarkey" lay-filter="fvarkey" >
					<option value="">可选</option>
					<option value="1" <?if eq $.one.fvarkey 1 ?> selected  <? end ?>>数字型</option>
					<option value="2" <?if eq $.one.fvarkey 2 ?> selected  <? end ?>>字符型</option>
				</select>
			</div>
		</div>
	</div>

	<div class="layui-card-body">
		<table id="app-field-list" lay-filter="app-field-list"></table>
	</div>

	<div class="layui-form-item layui-hide">
		<input type="button" lay-submit lay-filter="layuiadmin-app-form-submit" id="layuiadmin-app-form-submit" value="确认添加">
		<input type="button" lay-submit lay-filter="layuiadmin-app-form-edit" id="layuiadmin-app-form-edit" value="确认编辑">
	</div>

</div>

<script type="text/html" id="tbBasicTbBar">
	<a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del"><i class="layui-icon layui-icon-delete"></i>删除</a>
</script>


<script type="text/html" id="requiredTpl">
	{{# if (d.required == 1) { }}
	<font color="green">是</font>
	{{# } else { }}
	<font color="red">否</font>
	{{# } }}
</script>

<script type="text/html" id="fsearchTpl">
	{{# if (d.fsearch == 1) { }}
	<font color="green">是</font>
	{{# } else { }}
	<font color="red">否</font>
	{{# } }}
</script>

<script type="text/html" id="islistTpl">
	{{# if (d.islist == 1) { }}
	<font color="green">是</font>
	{{# } else { }}
	<font color="red">否</font>
	{{# } }}
</script>
<script src="/static/layui/layui.js"></script>
<script>
	layui.use(function () {
		var $ = layui.$;
		var layer = layui.layer;
		var form = layui.form;
		var table = layui.table;

		// 【修改点2】封装显隐判定逻辑
		function handleFvarkeyDisplay(value) {
			if (value && value !== "") {
				$('#fvarkey-group').show();
			} else {
				$('#fvarkey-group').hide();
				// 隐藏的同时清空关联类型的值，避免脏数据提交
				$('#fvarkey').val('');
				form.render('select', 'layuiadmin-app-form-list');
			}
		}

		// 【修改点3】监听关联字典的选择切换
		form.on('select(fvarname)', function(data){
			handleFvarkeyDisplay(data.value);
		});

		// 【修改点4】初始化时调用一次（针对编辑已有字段时，如果已有字典值则直接展示）
		handleFvarkeyDisplay($('#fvarname').val());


		//监听提交
		form.on('submit(layuiadmin-app-form-submit)', function(data){

			var field = data.field; //获取提交的字段

			if(field.flen) field.flen = parseInt(field.flen, 10);
			if(field.ordnum) field.ordnum = parseInt(field.ordnum, 10);

			var numberFields = ['id', 'required', 'ftype', 'flen', 'is_index', 'islist', 'ordnum', 'fsearch', 'fvarkey'];
			numberFields.forEach(function (key) {
				field[key] = (field[key] !== undefined && field[key] !== "") ? Number(field[key]) : 0;
			});

			var index = parent.layer.getFrameIndex(window.name); //先得到当前iframe层的索引
			var t = layer.load(1);

			//提交 Ajax 成功后，关闭当前弹层并重载表格
			$.ajax({
				url: '?module=systable&act=field&do=add',
				data: JSON.stringify(field),
				type: 'post',
				contentType: 'application/json',
				dataType: 'json',
				success: function (res) {
					if (res.code === 0) {
						layer.msg("保存完成",{icon:6,time:800});
						tableIns.reload();
					}else {
						if (res.msg) {
							layer.msg(res.msg, {icon: 5});
						} else layer.msg('操作失败', {icon: 5});
					}
					layer.close(t);
				},
				error: function (xhr) {
					layer.close(t);
				}
			});
		});

		var tableIns = table.render({
			elem: '#app-field-list'
			,height:535
			,url:  '?module=systable&act=field&do=getdata&id=<?.id?>'
			,cols: [[
				{field: 'fname', title: 'name', width: 150}
				,{field: 'cname', title: '中文',event: 'view', style:'cursor: pointer;', width: 150}
				,{field: 'ftype', title: '类型', width: 100}
				,{field: 'flen', title:  '长度',sort:true, width: 100}
				,{field: 'required', title:  '必填项',sort:true, templet: '#requiredTpl',width: 100}
				,{field: 'input', title:   '输入框'}
				,{field: 'fvarname', title:  '字典变量',sort:true,event: 'parameter', style:'cursor: pointer;', width: 150}
				,{field: 'parnum', title:    '数量',sort:true, width: 100}
				,{field: 'fsearch', title:   '搜索',sort:true, templet: '#fsearchTpl', width: 80}
				,{field: 'fsearchway', title:    '查询',sort:true, width: 80}
				,{field: 'islist', title:    '列表',sort:true, templet: '#islistTpl', width: 80}
				,{title: '操作',   toolbar: '#tbBasicTbBar', width: 220}

			]]
			,page: false
			,limit:    20
			,limits: [10, 15, 20, 25, 30]
			,text: {none: '暂无相关数据！'}
		});

		table.on('tool(app-field-list)',function(obj){
			var data = obj.data;
			if (obj.event == 'view'){
				location.href = '?module=systable&act=field&do=set&id=<?.id?>&bid='+data.id;
			} else
			if (obj.event == 'parameter'){

				if (data.fvarname.length > 0 ) {
					layer.open({
						type: 2
						,title: '调整参数'
						,content: '?module=sysparameter&act=set&name='+data.fvarname
						,area: ['99%', '700px']
						,btn: ['保存参数', '取消']
						,resize: false
						,yes: function(index, layero){
							var submit = layero.find('iframe').contents().find("#layuiadmin-app-form-submit");
							submit.click();
						}
					});
				}
			} else
			if(obj.event === 'del'){
				layer.confirm('确定删除？', function(index){
					$.ajax({
						url: '?module=systable&act=field&do=del&id='+data.id,
						type: 'get',
						dataType: 'json',
						success: function (res) {
							if (res.code === 0) {
								table.reload("app-field-list");
								layer.msg('完成',{icon:1});
							}else {
								if (res.msg) {
									layer.msg(res.msg, {icon: 5});
								} else layer.msg('失败', {icon: 5});
							}
						}
					});
				});
			}

		});


	});

</script>
</body>
</html>
<? end ?>

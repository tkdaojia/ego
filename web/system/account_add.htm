<? define "sysaccount/add.htm" ?>
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title></title>
  <meta name="renderer" content="webkit">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=0">
  <link rel="stylesheet" href="/static/layui/css/layui.css" media="all">
</head>
<body>

<div class="layui-form" lay-filter="layuiadmin-app-form-list" id="layuiadmin-app-form-list" style="padding: 20px 30px 0 0;">
  <input name="id" type="hidden" value="<? .id ?>"/>
  <div class="layui-form-item">
    <label class="layui-form-label">账号</label>
    <div class="layui-input-inline">
      <input type="text" name="account" value="<?.info.account?>" lay-verify="required" placeholder="请输入账号" autocomplete="off" class="layui-input">
    </div>
    <label class="layui-form-label">姓名</label>
    <div class="layui-input-inline">
      <input type="text" name="truename" value="<?.info.truename?>" lay-verify="required" placeholder="请输入姓名" autocomplete="off" class="layui-input">
    </div>
  </div>
  <div class="layui-form-item">
    <label class="layui-form-label">权限组</label>
    <div class="layui-input-inline">
      <div id="demo3"></div>
    </div>
    <label class="layui-form-label">重置密码</label>
    <div class="layui-input-inline">
      <input type="text" name="password" value="" autocomplete="off" class="layui-input">
    </div>
  </div>
  <div class="layui-form-item">
    <label class="layui-form-label">系统组</label>
    <div class="layui-input-inline">
      <input type="text" name="sysgroup" value="<?.info.sysgroup?>" autocomplete="off" class="layui-input">
    </div>
  </div>

  <div class="layui-form-item layui-hide">
    <input type="button" lay-submit lay-filter="layuiadmin-app-form-submit" id="layuiadmin-app-form-submit" value="确认添加">
    <input type="button" lay-submit lay-filter="layuiadmin-app-form-edit" id="layuiadmin-app-form-edit" value="确认编辑">
  </div>
</div>

<script src="/static/layui/layui.js"></script>
<script src="/static/layui/extend/xm-select.js"></script>
<script src="/static/layui/extend/axios.min.js"></script>
<script>
  var demo3 = xmSelect.render({
    el: '#demo3',
    name: 'role_id',
    layVerify: 'required',
    tips: '请选择权限组',
    height: 'auto',
    data: [
      <? range .role ?>
      {name: '<?.rname?>', <?if .select?> selected: true, <? end ?> value: <?.id?>},
      <? end ?>
  ]
  });

  layui.use(function () {
    var $ = layui.$;
    var layer = layui.layer;
    var form = layui.form;

    // 监听提交
    form.on('submit(layuiadmin-app-form-submit)', function(data){
      var field = data.field; // 获取提交的表单基础字段

      field.id = (field.id && !isNaN(field.id)) ? Number(field.id) : 0;

      var index = parent.layer.getFrameIndex(window.name);
      var t = layer.load(1);

      var apiUrl = '?module=sysaccount&act=main&do=create'; // 默认是新增
      if (field.id > 0) {
        apiUrl = '?module=sysaccount&act=main&do=update';
      }

      $.ajax({
        url: apiUrl,
        type: 'post',
        dataType: 'json',
        contentType: 'application/json; charset=utf-8', // 指定传输格式为 JSON
        data: JSON.stringify(field),                    // 将数据对象序列化为 JSON 字符串
        success: function (res) {
          if (res.code === 0) {
            parent.layui.table.reload('LAY-table-list');
            parent.layer.close(index);
          } else {
            if (res.msg) {
              layer.msg(res.msg, {icon: 5});
            } else {
              layer.msg('操作失败', {icon: 5});
            }
          }
          layer.close(t);
        },
        error: function (xhr) {
          layer.close(t);
          layer.msg('网络请求异常', {icon: 5});
        }
      });
    });
  });
</script>

</body>
</html>
<? end ?>

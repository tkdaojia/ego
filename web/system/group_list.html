<? define "sysgroup/sysgroupList.htm" ?>
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title></title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <link rel="stylesheet" href="/static/layui/css/layui.css" media="all">
    <!--[if lt IE 9]>
    <script src="https://oss.maxcdn.com/html5shiv/3.7.3/html5shiv.min.js"></script>
    <script src="https://oss.maxcdn.com/respond/1.4.2/respond.min.js"></script>
    <![endif]-->
</head>
<body>
<!-- 正文开始 -->
<!-- 💡 方案一：这里给 padding-top 加到了 20px，整个卡片上方就不会紧贴浏览器边缘了 -->
<div class="layui-fluid" style="padding: 20px 15px 15px 15px;">
    <div class="layui-card">
        <div class="layui-card-body">
            <!-- 表格工具栏 -->
            <form class="layui-form toolbar table-tool-mini">
                <div class="layui-form-item">
                    <div class="layui-inline" >
                        <button class="layui-btn icon-btn layui-btn-radius layui-btn-sm" id="inputBtnAdd"  type="button">
                            <i class="layui-icon layui-icon-addition layuiadmin-button-btn"></i>新增
                        </button>
                    </div>
                </div>
            </form>
            <!-- 数据表格 -->
            <table id="LAY-table-list" lay-filter="LAY-table-list"></table>
        </div>
    </div>
</div>

<script type="text/html" id="table-do-tool">
    <a class="layui-btn layui-btn-normal layui-btn-xs" lay-event="edit"><i class="layui-icon layui-icon-edit"></i>编辑</a>
    <a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del"><i class="layui-icon layui-icon-delete"></i>删除</a>
</script>

<script type="text/html" id="statusTpl">
    {{# if (d.state == 1) { }}
    <font color="green">使用</font>
    {{# } else { }}
    <font color="red">关闭</font>
    {{# } }}
</script>

<script type="text/javascript" src="/static/layui/layui.js"></script>
<script>
    layui.use(function () {
        var $ = layui.$
            ,form = layui.form
            ,table = layui.table;

        //监听搜索
        form.on('submit(LAY-app-search)', function(data){
            var field = data.field;
            table.reload('LAY-table-list', {
                page: { curr: 1 },
                where: field
            });
            return false;
        });


        table.render({
            elem: '#LAY-table-list'
            ,height: 'full-100'
            ,url:  '?module=sysgroup&act=main&do=getdata'
            ,cellMinWidth: 100
            ,cols: [[
                {field: 'id', title: 'ID',width:90}
                ,{field: 'gname', title: '名称',width:120}
                ,{field: 'icon', title:  '图标',width: 150}
                ,{field: 'indextpl', title:  '首页模板',    }
                ,{field: 'ordnum', title:    '排序',  }
                ,{field: 'state', title: '状态', templet: '#statusTpl'    }
                ,{field: 'created_at', title: '创建时间',    }
                ,{field: 'updated_at', title: '修改时间',    }
                ,{title: '操作', width:    250, align:    'center', fixed: 'right', toolbar: '#table-do-tool'}

            ]]
            ,page: true
            ,limit:    20
            ,limits: [10, 15, 20, 25, 30]
            ,text: {
                none:'暂无数据'
            }
        });

        //监听工具条
        table.on('tool(LAY-table-list)', function(obj){
            var data = obj.data;
            var id = data.id;

            if(obj.event === 'del'){
                layer.confirm('确定删除？', function(index){
                    $.ajax({
                        url: '?module=sysgroup&act=main&do=del&id='+id,
                        type: 'get',
                        dataType: 'json',
                        success: function (res) {
                            if (res.code === 0) {
                                table.reload("LAY-table-list");
                                layer.msg('完成',{icon:1});
                            }else {
                                if (res.msg) {
                                    layer.msg(res.msg, {icon: 5});
                                } else layer.msg('失败', {icon: 5});
                            }
                        }
                    });
                });
            } else if(obj.event === 'edit'){
                var tr = $(obj.tr);

                layer.open({
                    type: 2
                    ,title: '编辑'
                    ,content: '?module=sysgroup&act=main&do=add&id='+id
                    ,area: ['750px', '550px']
                    ,btn: ['确定', '取消']
                    ,resize: false
                    ,yes: function(index, layero){
                        // 💡 顺手调整：触发弹窗内部的 #layuiadmin-app-form-edit 按钮，语义更清晰
                        var submit = layero.find('iframe').contents().find("#layuiadmin-app-form-submit");
                        submit.click();
                    }
                });
            }
        });

        //新增
        $('#inputBtnAdd').click(function(){
            layer.open({
                type: 2
                ,title: '添加'
                ,content: '?module=sysgroup&act=main&do=add&rand=1.1'
                ,maxmin: true
                ,area: ['100%', '100%']
                ,btn: ['确定', '取消']
                ,yes: function(index, layero){
                    //点击确认触发 iframe 内容中的按钮提交
                    var submit = layero.find('iframe').contents().find("#layuiadmin-app-form-submit");
                    submit.click();
                }

            });
        });


    });
</script>
</body>
</html>
<? end ?>

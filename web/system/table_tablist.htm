<? define "systable/tablist.htm" ?>
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title></title>
  <meta name="renderer" content="webkit">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=0">
	<link rel="stylesheet" href="/static/layui/css/layui.css" media="all">
	<!--[if lt IE 9]>
	<script src="https://oss.maxcdn.com/html5shiv/3.7.3/html5shiv.min.js"></script>
	<script src="https://oss.maxcdn.com/respond/1.4.2/respond.min.js"></script>
    <![endif]-->
</head>
<body>

<div class="layui-fluid" style="padding: 20px 15px 15px 15px;">
    <div class="layui-card">
        <div class="layui-card-body">
            <!-- 表格工具栏 -->
            <form class="layui-form toolbar table-tool-mini">
                <div class="layui-form-item">
					<div class="layui-inline">
                        <label class="layui-form-label w-auto">类型:</label>
                        <div class="layui-input-inline">
                            <select lay-search name="tabtype" lay-filter="tabtype"  >
							  <option value="">请选择</option>
							  <? range $k, $v  := .tabType ?>
								<option value="<? $k ?>" ><? $v ?></option>
							  <? end ?>
							  </select>
                        </div>
                    </div>
					<div class="layui-inline">
                        <label class="layui-form-label w-auto">菜单:</label>
                        <div class="layui-input-inline">
                            <select lay-search name="sysmenu" lay-filter="sysmenu"  >
							  <option value="">请选择</option>
							  <? range $k, $v  := .sysMenu ?>
								<option value="<? $k ?>" ><? $v ?></option>
							  <? end ?>
							  </select>
                        </div>
                    </div>
					<div class="layui-inline" >
						<button class="layui-btn icon-btn layui-btn-radius layui-btn-sm" lay-filter="LAY-app-search" lay-submit>
					        <i class="layui-icon">&#xe615;</i>查询
					    </button>
						<button class="layui-btn icon-btn layui-btn-radius layui-btn-sm" id="inputBtnAdd"  type="button">
						  <i class="layui-icon layui-icon-addition layuiadmin-button-btn"></i>新增
						</button>
					</div>
                </div>
            </form>
            <!-- 数据表格 -->
            <table id="LAY-app-role-list" lay-filter="LAY-app-role-list"></table>


			<script type="text/html" id="tbBasicTbBar">

				<a class="layui-btn layui-btn-xs" lay-event="cmore">
				  选择操作 
				  <i class="layui-icon layui-icon-down"></i>
				</a>

				
				<a class="layui-btn layui-btn-xs" lay-event="ego">
				  Ego 
				  <i class="layui-icon layui-icon-down"></i>
				</a>

			</script>


        </div>
    </div>
</div>


<script src="/static/layui/layui.js"></script>
<script>
layui.use(['layer', 'form', 'table', 'dropdown'], function () {
    var $ = layui.$
    ,form = layui.form
    ,table = layui.table
	,dropdown = layui.dropdown;
		  
    //监听搜索
    form.on('submit(LAY-app-search)', function(data){
      var field = data.field;
      
      //执行重载
      table.reload('LAY-app-role-list', {
        where: field
      });
	  return false;
    });

    table.render({
  	elem: '#LAY-app-role-list'
	,height: 'full-98'
  	,url:  '?module=systable&act=tab&do=getdata' 
	,cellMinWidth: 100
  	,cols: [[
	    {field: 'id', title: 'ID', width:80},
		{field: 'tabname', title: '数据表名', width:230},
		{field: 'tabtype', title: '类型', width :80},
		{field: 'remarks', title: '备注'},
		{field: 'tabkey', title: '标识'},
		{field: 'pubmenu', title: '菜单', width:100},
		{title: '操作', align:	'center', width:280,  toolbar: '#tbBasicTbBar'}

  	]]
  	,page: false
  	,limit:	30
  	,limits: [30,60,120,240]
  	,text: {
		none:'暂无数据'
		}
    });

	 /* 表格工具条点击事件 */
	table.on('tool(LAY-app-role-list)', function (obj) {
		var data = obj.data; // 获得当前行数据
		var id = data.id;
		
		if(obj.event === 'cmore'){
      // 更多 - 下拉菜单
      dropdown.render({
        elem: this, // 触发事件的 DOM 对象
        show: true, // 外部事件触发即显示
        data: [{
          title: '字段',
          id: 'field'
        },{
          title: '编辑',
          id: 'edit'
        },{
          title: '删除',
          id: 'del'
        },{
          title: 'XLS设定',
          id: 'xls'
        },{
          title: '清空数据(含子表)',
          id: 'clr'
        }],
		click: function(menudata){
			 if(menudata.id === 'field'){
				layer.open({
				  type: 2
				  ,title: '字段'
				  ,content: '?module=systable&act=field&do=set&id='+id
				  ,maxmin: true
				  ,area: ['100%', '100%']
				  ,btn: ['确定', '取消']
				  ,resize: false
				  ,yes: function(index, layero){
					var submit = layero.find('iframe').contents().find("#layuiadmin-app-form-submit");
					submit.click();insTb.refresh();
				  }
				  ,success: function(layero, index){
				  }
				});
			  }  else if (menudata.id === 'edit'){ 
				layer.open({
				  type: 2
				  ,title: '编辑'
				  ,content: '?module=systable&act=tab&do=add&id='+id
				  ,area: ['100%', '100%']
				  ,btn: ['确定', '取消']
				  ,resize: false
				  ,yes: function(index, layero){
					var submit = layero.find('iframe').contents().find("#layuiadmin-app-form-submit");
					submit.click();
				  }
				  ,success: function(layero, index){
				  }
				});
			  }  else if (menudata.id === 'del'){ 
					layer.confirm('确定删除？', function(index){
					  $.ajax({
							url: '?module=systable&act=tab&do=del&id='+id,
							type: 'get',
							dataType: 'json',
							success: function (res) {
								if (res.code === 0) {
									table.reload("LAY-app-role-list");
									layer.msg('完成',{icon:1});
								}else {
									if (res.msg) {
										layer.msg(res.msg, {icon: 5});
									} else layer.msg('失败', {icon: 5});
								}
							}
						});
					});
			
			  } else if (menudata.id === 'clr'){
					layer.confirm('确定清空？', function(index){
					  $.ajax({
							url: '?module=systable&act=tab&do=clr&id='+id,
							type: 'get',
							dataType: 'json',
							success: function (res) {
								if (res.success) {
									table.reload("LAY-app-role-list");
									layer.msg('完成',{icon:1});
								}else {
									if (res.msg) {
										layer.msg(res.msg, {icon: 5});
									} else layer.msg('失败', {icon: 5});
								}
							}
						});
					});
			  }
			  else if (menudata.id === 'xls'){ 
				layer.open({
				  type: 2
				  ,title: 'XLS'
				  ,content: '?module=systable&act=tab&do=xls&id='+id
				  ,area: ['100%', '100%']
				  ,btn: false
				  ,resize: false
				  ,yes: function(index, layero){
					var submit = layero.find('iframe').contents().find("#layuiadmin-app-form-submit");
					submit.click();
				  }
				  ,success: function(layero, index){
				  }
				});
			  }

		},
		})
		}  else if(obj.event === 'ego'){
		
			  // 更多 - 下拉菜单
			  dropdown.render({
				elem: this, // 触发事件的 DOM 对象
				show: true, // 外部事件触发即显示
				data: [{
				  title: '一键',
				  id: 'all'
				},{
				  title: '模型',
				  id: 'model'
				},{
				  title: '代码',
				  id: 'code'
				},{
				  title: '页面',
				  id: 'html'
				},{
				  title: 'MySql',
				  id: 'mysql'
				}],
				click: function(menudata){
					if (menudata.id === 'all'){
						
						layer.confirm('确定执行？', function(index){
						  $.ajax({
								url: '?module=systable&act=tab&do=ego&ftype=all&id='+id,
								type: 'get',
								dataType: 'json',
								success: function (res) {
									if (res.success) {
										table.reload("LAY-app-role-list");
										layer.msg('完成',{icon:1});
									}else {
										if (res.msg) {
											layer.msg(res.msg, {icon: 5});
										} else layer.msg('失败', {icon: 5});
									}
								}
							});
						});
					} else if (menudata.id === 'model'){ 
						layer.confirm('确定执行？', function(index){
						  $.ajax({
								url: '?module=systable&act=tab&do=ego&ftype=model&id='+id,
								type: 'get',
								dataType: 'json',
								success: function (res) {
									if (res.success) {
										table.reload("LAY-app-role-list");
										layer.msg('完成',{icon:1});
									}else {
										if (res.msg) {
											layer.msg(res.msg, {icon: 5});
										} else layer.msg('失败', {icon: 5});
									}
								}
							});
						});
					} 
					else if (menudata.id === 'code') { 
							layer.confirm('确定执行？', function(index){
							  $.ajax({
									url: '?module=systable&act=tab&do=ego&ftype=code&id='+id,
									type: 'get',
									dataType: 'json',
									success: function (res) {
										if (res.success) {
											table.reload("LAY-app-role-list");
											layer.msg('完成',{icon:1});
										}else {
											if (res.msg) {
												layer.msg(res.msg, {icon: 5});
											} else layer.msg('失败', {icon: 5});
										}
									}
								});
							});
						}
					else if (menudata.id === 'mysql'){ 
						layer.confirm('确定执行？', function(index){
						  $.ajax({
								url: '?module=systable&act=tab&do=ego&ftype=mysql&id='+id,
								type: 'get',
								dataType: 'json',
								success: function (res) {
									if (res.success) {
										table.reload("LAY-app-role-list");
										layer.msg('完成',{icon:1});
									}else {
										if (res.msg) {
											layer.msg(res.msg, {icon: 5});
										} else layer.msg('失败', {icon: 5});
									}
								}
							});
						});
					} 
		
					else if (menudata.id === 'html') { // 修改
							layer.confirm('确定执行？', function(index){
							  $.ajax({
									url: '?module=systable&act=tab&do=ego&ftype=html&id='+id,
									type: 'get',
									dataType: 'json',
									success: function (res) {
										if (res.success) {
											table.reload("LAY-app-role-list");
											layer.msg('完成',{icon:1});
										}else {
											if (res.msg) {
												layer.msg(res.msg, {icon: 5});
											} else layer.msg('失败', {icon: 5});
										}
									}
								});
							});
						}
					},
				
				});
	 }

	 });

	//新增
	$('#inputBtnAdd').click(function(){
		layer.open({
		  type: 2
		  ,title: '添加'
		  ,content: '?module=systable&act=tab&do=add'
		  ,maxmin: true
		  ,area: ['100%', '100%']
		  ,btn: ['确定', '取消']
		  ,yes: function(index, layero){
			//点击确认触发 iframe 内容中的按钮提交
			var submit = layero.find('iframe').contents().find("#layuiadmin-app-form-submit");
			submit.click();
		  }
		});
	});
  });
  </script>
</body>
</html>

<? end ?>

<script src="/static/layui/layui.js"></script>
<script>
	layui.use(['layer', 'form', 'table'], function () {
		var $ = layui.$;
		var form = layui.form;
		var layer = layui.layer;

		// 联动选择关联表时加载字段列表
		form.on('select(fat_tab_id)', function(data){
			var nos = $("#fat_tab_id").val();
			if(!nos) {
				$("#fat_key_field_id").html('<option value="">选择关联表</option>');
				form.render('select');
				return;
			}
			$.ajax({
				url: '?module=systable&act=field&do=select&tab_id=' + nos,
				type: 'get',
				dataType: 'json',
				success: function (res) {
					var data = res.data;
					var str = '<option value="">请选择判断字段</option>';
					for(var x in data){
						str += '<option value = "' + data[x].id + '">' + data[x].cname + '['+ data[x].fname + ']' + '</option>';
					}
					$("#fat_key_field_id").html(str);
					form.render('select');
				}
			});
		});

		// 监听提交
		form.on("submit(layuiadmin-app-form-submit)", function(data){
			var field = data.field; // 获取提交的字段
			var index = parent.layer.getFrameIndex(window.name); // 先得到当前iframe层的索引

			var numberFields = ['id', 'fat_tab_id', 'fat_key_field_id'];
			numberFields.forEach(function (key) {
				field[key] = (field[key] !== undefined && field[key] !== "") ? Number(field[key]) : 0;
			});

			var t = layer.load(1);

			$.ajax({
				url: "?module=systable&act=tab&do=xlsedit",
				data: JSON.stringify(field),       // 序列化为 JSON 字符串
				type: "post",
				contentType: "application/json",  // 声明请求头格式为 JSON
				dataType: "json",
				success: function (res) {
					if (res.success || res.code === 0) {
						parent.layui.table.reload("LAY-table-list");
						parent.layer.close(index);
					} else {
						if (res.msg) {
							layer.msg(res.msg, {icon: 5});
						} else layer.msg("操作失败", {icon: 5});
					}
					layer.close(t);
				},
				error: function (xhr) {
					layer.close(t);
					layer.msg("网络通讯异常", {icon: 5});
				}
			});
		});
	});
</script>

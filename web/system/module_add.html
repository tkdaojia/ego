<? define "sysmodule/add.htm" ?>
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title></title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <link rel="stylesheet" href="/static/layui/css/layui.css" media="all">
</head>
<body>

<div class="layui-form model-form" lay-filter="layuiadmin-app-form-list" id="layuiadmin-app-form-list" style="padding: 20px 30px 0 0;">
    <input name="id" type="hidden" value="<?.info.ID?>"/>
    <div class="layui-form-item">
        <label class="layui-form-label">父类</label>
        <div class="layui-input-inline">
            <select name="pid" lay-search>
                <option value="">请选择</option>
                <? range  .cate ?>
                <option value="<? .ID ?>" <?if eq .ID $.pid?> selected  <? end ?> ><? .Mname ?></option>
                <? end ?>
            </select>
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">名称</label>
        <div class="layui-input-inline">
            <input type="text" name="mname" value="<? .info.Mname ?>" lay-verify="required" placeholder="请输入名称" autocomplete="off" class="layui-input">
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">备注</label>
        <div class="layui-input-inline">
            <input type="text" name="remarks" value="<? .info.Remarks ?>"  autocomplete="off" class="layui-input">
        </div>
    </div>
    <div class="layui-form-item layui-hide">
        <input type="button" lay-submit lay-filter="layuiadmin-app-form-submit" id="layuiadmin-app-form-submit" value="确认添加">
        <input type="button" lay-submit lay-filter="layuiadmin-app-form-edit" id="layuiadmin-app-form-edit" value="确认编辑">
    </div>
</div>
<script src="/static/layui/layui.js"></script>

<script>
    layui.use(function () {
        var $ = layui.$;
        var layer = layui.layer;
        var form = layui.form;

        //监听提交
        form.on('submit(layuiadmin-app-form-submit)', function(data){
            var field = data.field; //获取提交的字段
            var index = parent.layer.getFrameIndex(window.name); //先得到当前iframe层的索引

            var loading = layer.load(1);

            field.id = Number(field.id) || 0;
            var apiUrl = '?module=sysmodule&act=main&do=create'; // 默认是新增
            if (field.id > 0) {
                apiUrl = '?module=sysmodule&act=main&do=update';
            }

            $.ajax({
                url: apiUrl,
                data: JSON.stringify(field), // 转 JSON 字符串
                type: 'post',
                dataType: 'json',
                contentType: 'application/json; charset=utf-8',
                success: function (res) {
                    if (res.code === 0) {
                        parent.layui.treeTable.reload("LAY-app-module-list");
                        parent.layer.close(index);
                    }else {
                        layer.msg(res.msg || '操作失败', {icon: 5});
                    }
                    layer.close(loading);
                },
                error: function (xhr) {
                    layer.close(loading);
                    layer.msg('请求失败', {icon:5});
                }
            });
        });
    });
</script>
</body>
</html>
<? end ?>

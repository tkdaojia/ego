<? define "sysaccount/list.htm" ?>
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>办公系统</title>
  <meta name="renderer" content="webkit">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <link rel="stylesheet" href="/static/layui/css/layui.css" media="all">
	<!--[if lt IE 9]>
	<script src="https://oss.maxcdn.com/html5shiv/3.7.3/html5shiv.min.js"></script>
	<script src="https://oss.maxcdn.com/respond/1.4.2/respond.min.js"></script>
    <![endif]-->
</head>
<body>


<!-- 正文开始 -->
<div class="layui-fluid" style="padding: 20px 15px 15px 15px;">
    <div class="layui-card">
        <div class="layui-card-body">
            <!-- 表格工具栏 -->
            <form class="layui-form toolbar table-tool-mini">
                <div class="layui-form-item">
                    <div class="layui-inline">
                        <label class="layui-form-label w-auto">账号:</label>
                        <div class="layui-input-inline">
							 <input type="text" name="account" placeholder="请输入" autocomplete="off" class="layui-input">
                        </div>
                    </div>
					<div class="layui-inline">
					  <label class="layui-form-label">姓名</label>
					  <div class="layui-input-block">
					   <input type="text" name="truename" placeholder="请输入" autocomplete="off" class="layui-input">
					  </div>
					</div>
                    <div class="layui-inline" >
                        <button class="layui-btn icon-btn layui-btn-radius layui-btn-sm" lay-filter="LAY-app-search" lay-submit>
                            <i class="layui-icon">&#xe615;</i>查询
                        </button>
						<button class="layui-btn icon-btn layui-btn-radius layui-btn-sm" id="inputBtnAdd"  type="button">
						  <i class="layui-icon layui-icon-addition layuiadmin-button-btn"></i>新增
						</button>
                    </div>
                </div>
            </form>
            <!-- 数据表格 -->
            <table id="LAY-table-list" lay-filter="LAY-table-list"></table>
        </div>
    </div>
</div>

<script type="text/html" id="table-do-tool">
	<a class="layui-btn layui-btn-normal layui-btn-xs" lay-event="edit"><i class="layui-icon layui-icon-edit"></i>编辑</a>
    <a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del"><i class="layui-icon layui-icon-delete"></i>删除</a>
</script>

<script src="/static/layui/layui.js"></script>
<script>
    layui.use(function () {
        var $ = layui.$;
        var layer = layui.layer;
        var form = layui.form;
    var table = layui.table;
    
    //监听搜索
    form.on('submit(LAY-app-search)', function(data){
      var field = data.field;
      
      //执行重载
      table.reload('LAY-table-list', {
		page: { curr: 1 },
        where: field
      });
	  return false;
    });


    table.render({
  	elem: '#LAY-table-list'
	,height: 'full-98'
  	,url:  '?module=sysaccount&act=main&do=getdata'
	,cellMinWidth: 100

  	,cols: [[
		{type: 'numbers'}
  	  ,{field: 'account', title: '账号',width: 150}
	  ,{field: 'truename', title:	'姓名',width: 150}
	  ,{field: 'role_name', title:	'权限组',	}
	  ,{field: 'sys_group', title:	'系统组',	}
	  ,{field: 'status_name', title:	'状态',width: 80,templet: function (d) {
                    var strs = [
                        '',
                        '<span class="text-success">正常</span>',
						'<font color="red">停用</font>'
                    ];
                    return strs[d.status];
                }}
  	  ,{title: '操作', width:	150, align:	'center', fixed: 'right', toolbar: '#table-do-tool'}

  	]]
  	,page: true
  	,limit:	20
  	,limits: [10, 15, 20, 25, 30]
  	,text: {
		none:'暂无数据'
		}
    });

    //监听工具条
    table.on('tool(LAY-table-list)', function(obj){
      var data = obj.data;
	  var id = data.id;

      if(obj.event === 'del'){
        layer.confirm('确定删除？', function(index){
          $.ajax({
                url: '?module=sysaccount&act=main&do=del',
                    type: 'post',
                    dataType: 'json',
                    contentType: "application/json; charset=utf-8",
                    data: JSON.stringify({
                        id: id
                    }),
                success: function (res) {
                    if (res.code === 0) {
						table.reload("LAY-table-list");
						layer.msg('完成',{icon:1});
                    }else {
						if (res.msg) {
							layer.msg(res.msg, {icon: 5});
						} else layer.msg('失败', {icon: 5});
                    }
                }
            });
        });
      } else if(obj.event === 'edit'){
        var tr = $(obj.tr);
  
        layer.open({
          type: 2
          ,title: '编辑'
          ,content: '?module=sysaccount&act=main&do=add&id='+id
          ,area: ['750px', '550px']
          ,btn: ['确定', '取消']
          ,resize: false
          ,yes: function(index, layero){
			var submit = layero.find('iframe').contents().find("#layuiadmin-app-form-submit");
            submit.click();
          }
          ,success: function(layero, index){
              
          }
  
        });
      }

    });

	//新增
	$('#inputBtnAdd').click(function(){
		layer.open({
		  type: 2
		  ,title: '添加'
		  ,content: '?module=sysaccount&act=main&do=add'
		  ,maxmin: true
		  ,area: ['100%', '100%']
		  ,btn: ['确定', '取消']
		  ,yes: function(index, layero){
			//点击确认触发 iframe 内容中的按钮提交
			var submit = layero.find('iframe').contents().find("#layuiadmin-app-form-submit");
			submit.click();
		  }
		});
	});


  });
  </script>
</body>
</html>
<? end ?>

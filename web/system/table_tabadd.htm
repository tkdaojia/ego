<? define "systable/tabadd.htm" ?>
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title></title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <link rel="stylesheet" href="/static/layui/css/layui.css" media="all">
</head>
<body>

<div class="layui-form model-form" lay-filter="layuiadmin-app-form-list" id="layuiadmin-app-form-list" style="padding: 20px 30px 0 0;">
    <input name="id" type="hidden" value="<?.info.ID?>"/>
    <div class="layui-form-item">
        <label class="layui-form-label">数据表名</label>
        <div class="layui-input-inline">
            <input type="text" name="tabname" value="<? .info.Tabname ?>" lay-verify="required" placeholder="请输入名称" autocomplete="off" class="layui-input">
        </div>
        <label class="layui-form-label">标识</label>
        <div class="layui-input-inline">
            <input type="text" name="tabkey" value="<? .info.Tabkey ?>"  autocomplete="off" class="layui-input" lay-verify="required" placeholder="请输入标识">
        </div>

        <label class="layui-form-label">附件</label>
        <div class="layui-input-inline">
            <input type="number" name="upfile" value="<? .info.Upfile ?>"  autocomplete="off" class="layui-input">
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">中文名</label>
        <div class="layui-input-inline">
            <input type="text" name="remarks" value="<? .info.Remarks ?>"  autocomplete="off" class="layui-input">
        </div>

        <label class="layui-form-label">类型</label>
        <div class="layui-input-inline">
            <select lay-search name="tabtype" lay-filter="tabtype" lay-verify="required" >
                <option value="">请选择</option>
                <? range $k, $v  := .tabType ?>
                <option value="<? $k ?>" <?if eq $k $.info.Tabtype ?> selected  <?end?>><? $v ?></option>
                <? end ?>
            </select>
        </div>

        <label class="layui-form-label">父级表</label>
        <div class="layui-input-inline">
            <select lay-search name="fid" lay-filter="fid"  >
                <option value="">请选择</option>
                <? range $k, $v  := .tabArr ?>
                <option value="<? $k ?>" <?if eq $k $.info.Fid ?> selected  <?end?>><? $v ?></option>
                <? end ?>
            </select>
        </div>
    </div>

    <div class="layui-form-item layui-hide">
        <input type="button" lay-submit lay-filter="layuiadmin-app-form-submit" id="layuiadmin-app-form-submit" value="确认添加">
        <input type="button" lay-submit lay-filter="layuiadmin-app-form-edit" id="layuiadmin-app-form-edit" value="确认编辑">
    </div>
</div>

<script src="/static/layui/layui.js"></script>
<script>
    layui.use(function () {
        var $ = layui.$;
        var layer = layui.layer;
        var form = layui.form;

        // 监听提交
        form.on('submit(layuiadmin-app-form-submit)', function(data){
            var field = data.field; // 获取提交的字段
            var index = parent.layer.getFrameIndex(window.name); // 先得到当前iframe层的索引

            // 【修改点1】处理数字型字段，防止前端传空字符串 "" 或 字符串数字 导致 Go 后端反序列化失败
            var numberFields = ['id', 'tabtype', 'fid','upfile'];
            numberFields.forEach(function (key) {
                field[key] = (field[key] !== undefined && field[key] !== "") ? Number(field[key]) : 0;
            });

            var t = layer.load(1);

            var apiUrl = '?module=systable&act=tab&do=create'; // 默认是新增
            if (field.id > 0) {
                apiUrl = '?module=systable&act=tab&do=update';
            }

            // 提交 Ajax 成功后，关闭当前弹层并重载表格
            $.ajax({
                url: apiUrl,
                data: JSON.stringify(field),       // 【修改点2】将对象序列化为 JSON 字符串
                type: 'post',
                contentType: 'application/json',  // 【修改点3】指定请求头为 JSON 格式
                dataType: 'json',
                success: function (res) {
                    console.log(JSON.stringify(res));
                    if (res.success || res.code === 0) { // 兼容你可能使用的 res.code === 0 规范
                        parent.layui.table.reload("LAY-app-role-list");
                        parent.layer.close(index);
                    } else {
                        if (res.msg) {
                            layer.msg(res.msg, {icon: 5});
                        } else layer.msg('操作失败', {icon: 5});
                    }
                    layer.close(t);
                },
                error: function (xhr) {
                    layer.close(t);
                    layer.msg('网络请求异常', {icon: 5});
                }
            });
        });
    });
</script>
</body>
</html>
<? end ?>
